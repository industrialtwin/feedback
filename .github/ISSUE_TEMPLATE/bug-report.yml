name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Help > About shows it.
      placeholder: "0.9.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and GPU
      placeholder: "Windows 11, RTX 3060"
    validations:
      required: true
  - type: input
    id: data
    attributes:
      label: File format and size
      placeholder: "LAZ, 274 MB, 136 M points"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log or screenshot
      description: Activity > Copy log, or drag a screenshot here. Do not attach confidential data.