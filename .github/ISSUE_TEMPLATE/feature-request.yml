name: Feature request
description: A tool, format or workflow you need.
labels: [enhancement]
body:
  - type: textarea
    id: job
    attributes:
      label: What are you trying to get done?
      placeholder: "Check a tank shell against the design radius and export a report."
    validations:
      required: true
  - type: input
    id: data
    attributes:
      label: Data you work with
      placeholder: "E57 scans, IFC model"
  - type: textarea
    id: today
    attributes:
      label: How you do it today